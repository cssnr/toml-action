name: "Test"

# actions-up-ignore-file

on:
  workflow_dispatch:
  #schedule:
  #  - cron: "18 18 * * 1,3,5"
  push:
    branches: [master]
    paths:
      - ".github/workflows/test.yaml"
      - "dist/**"
      - "src/**"
      - "package*.json"
      - "requirements*.txt"
      - "action.yml"
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  file: .github/test/test.toml
  temp: tmp/temp.toml

jobs:
  test:
    name: "Test"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "Checkout"
        uses: actions/checkout@v6

      - name: "Debug event.json"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: cat "${GITHUB_EVENT_PATH}"
      - name: "Debug CTX github"
        if: ${{ !github.event.act }}
        continue-on-error: true
        env:
          GITHUB_CTX: ${{ toJSON(github) }}
        run: echo "$GITHUB_CTX"
      - name: "Debug Environment"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: env

      - name: "Test Local Action"
        id: test
        uses: ./
        with:
          file: ${{ env.file }}
          path: $.project.authors[0].name
          value: I Made This

      - name: "Validate Outputs"
        #if: ${{ !github.event.act }}
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.test.outputs) }}
          data: |
            value: Shane
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":"toml-action","dynamic":["version"],"authors":[{"name":"I Made This"}]}}'
            toml:

      - name: "Validate JSON Data"
        if: ${{ fromJSON(steps.test.outputs.data).project.name != 'toml-action' }}
        run: |
          echo "Output Invalid: data.project.name" && exit 1

      - name: "Debug 1"
        if: ${{ !github.event.act }}
        continue-on-error: true
        run: |
          echo "::group::env.file"
          cat ${{ env.file }}
          echo "::endgroup::"

      - name: "Read Updated TOML File"
        #if: ${{ !github.event.act }}
        id: toml
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $.project.authors[0].name

      - name: "Debug 2"
        if: ${{ !github.event.act }}
        continue-on-error: true
        env:
          OUTPUT: ${{ toJSON(steps.toml.outputs) }}
        run: |
          echo "::group::output"
          echo "${OUTPUT}"
          echo "::endgroup::"
          echo "::group::env.temp"
          cat ${{ env.temp }}
          echo "::endgroup::"

      - name: "Validate Updated Outputs"
        #if: ${{ !github.event.act }}
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.toml.outputs) }}
          data: |
            value: I Made This
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":"toml-action","dynamic":["version"],"authors":[{"name":"I Made This"}]}}'
            toml:

      - name: "Validate Output File"
        #if: ${{ !github.event.act }}
        run: |
          if [ ! -f "${{ env.temp }}" ];then
            echo "Missing Output File: ${{ env.temp }}"
            exit 1
          fi
          cat "${{ env.temp }}"

      - name: "Test Append to Existing Array"
        id: append-test
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $.project.dynamic
          value: new-tag
          append: true

      - name: "Validate Append Output"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.append-test.outputs) }}
          data: |
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":"toml-action","dynamic":["version","new-tag"],"authors":[{"name":"I Made This"}]}}'

      - name: "Test Set Non-Existent Path"
        id: create-test
        uses: ./
        with:
          file: ${{ env.file }}
          path: $.general.version
          value: "0.0.1"

      - name: "Validate Create Output"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.create-test.outputs) }}
          data: |
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":"toml-action","dynamic":["version"],"authors":[{"name":"I Made This"}]},"general":{"version":"0.0.1"}}'

      - name: "Validate Create Value Empty"
        if: ${{ steps.create-test.outputs.value != '' }}
        run: |
          echo "Expected create-test value output to be empty but it was not" && exit 1

      - name: "Test Append to Non-Existent Path (creates array)"
        id: append-create-test
        uses: ./
        with:
          file: ${{ env.file }}
          path: $.project.tags
          value: stable
          append: true

      - name: "Validate Append Create Output"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.append-create-test.outputs) }}
          data: |
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":"toml-action","dynamic":["version"],"authors":[{"name":"I Made This"}],"tags":["stable"]},"general":{"version":"0.0.1"}}'

      - name: "Validate Append Create Value Empty"
        if: ${{ steps.append-create-test.outputs.value != '' }}
        run: |
          echo "Expected append-create-test value output to be empty but it was not" && exit 1

      - name: "Test Append to Existing Non-Array Value (string)"
        id: append-scalar-string
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $.project.name
          value: new-name
          append: true

      - name: "Validate Append Scalar String Output"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.append-scalar-string.outputs) }}
          data: |
            value: toml-action
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":["toml-action","new-name"],"dynamic":["version"],"tags":["stable"],"authors":[{"name":"I Made This"}]},"general":{"version":"0.0.1"}}'

      - name: "Test Append to Existing Non-Array Value (number)"
        id: append-scalar-number
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $.general.version
          value: 42
          append: true

      - name: "Validate Append Scalar Number Output"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.append-scalar-number.outputs) }}
          data: |
            value: 0.0.1
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":"toml-action","dynamic":["version"],"tags":["stable"],"authors":[{"name":"I Made This"}]},"general":{"version":["0.0.1",42]}}'

      - name: "Test Append to Existing Non-Array Value (boolean)"
        id: append-scalar-boolean
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $.project.name
          value: true
          append: true

      - name: "Validate Append Scalar Boolean Output"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.append-scalar-boolean.outputs) }}
          data: |
            value: toml-action
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":["toml-action",true],"dynamic":["version"],"tags":["stable"],"authors":[{"name":"I Made This"}]},"general":{"version":"0.0.1"}}'

      - name: "Test Bracket-Quoted Key Read (existing)"
        id: bracket-read
        uses: ./
        with:
          file: ${{ env.file }}
          path: $['title']

      - name: "Validate Bracket-Quoted Key Read"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.bracket-read.outputs) }}
          data: |
            value: TOML Example

      - name: "Test Bracket-Quoted Key Set (existing)"
        id: bracket-set
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $.project['name']
          value: new-name

      - name: "Validate Bracket-Quoted Key Set"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.bracket-set.outputs) }}
          data: |
            value: toml-action
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":"new-name","dynamic":["version"],"tags":["stable"],"authors":[{"name":"I Made This"}]},"general":{"version":"0.0.1"}}'

      - name: "Test Bracket-Quoted Key Create (non-existent)"
        id: bracket-create
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $['new section']
          value: test-value

      - name: "Validate Bracket-Quoted Key Create"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.bracket-create.outputs) }}
          data: |
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":"toml-action","dynamic":["version"],"tags":["stable"],"authors":[{"name":"I Made This"}]},"general":{"version":"0.0.1"},"new section":"test-value"}'

      - name: "Test Wildcard Set"
        id: wildcard-set
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $.project.authors[*].name
          value: Wildcard

      - name: "Validate Wildcard Set"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.wildcard-set.outputs) }}
          data: |
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"tilde-value","project":{"name":"toml-action","dynamic":["version"],"tags":["stable"],"authors":[{"name":"Wildcard"}]},"general":{"version":"0.0.1"}}'

      - name: "Test Slash Key Read (existing)"
        id: slash-read
        uses: ./
        with:
          file: ${{ env.file }}
          path: $['slash/key']

      - name: "Validate Slash Key Read"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.slash-read.outputs) }}
          data: |
            value: slash-value

      - name: "Test Slash Key Set (existing)"
        id: slash-set
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $['slash/key']
          value: new-slash-value

      - name: "Validate Slash Key Set"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.slash-set.outputs) }}
          data: |
            value: slash-value
            data: '{"title":"TOML Example","slash/key":"new-slash-value","tilde~key":"tilde-value","project":{"name":"toml-action","dynamic":["version"],"tags":["stable"],"authors":[{"name":"I Made This"}]},"general":{"version":"0.0.1"}}'

      - name: "Test Tilde Key Read (existing)"
        id: tilde-read
        uses: ./
        with:
          file: ${{ env.file }}
          path: $['tilde~key']

      - name: "Validate Tilde Key Read"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.tilde-read.outputs) }}
          data: |
            value: tilde-value

      - name: "Test Tilde Key Set (existing)"
        id: tilde-set
        uses: ./
        with:
          file: ${{ env.file }}
          output: ${{ env.temp }}
          path: $['tilde~key']
          value: new-tilde-value

      - name: "Validate Tilde Key Set"
        uses: cssnr/validate-outputs-action@master
        with:
          outputs: ${{ toJSON(steps.tilde-set.outputs) }}
          data: |
            value: tilde-value
            data: '{"title":"TOML Example","slash/key":"slash-value","tilde~key":"new-tilde-value","project":{"name":"toml-action","dynamic":["version"],"tags":["stable"],"authors":[{"name":"I Made This"}]},"general":{"version":"0.0.1"}}'

      - name: "Test Reject Filter (unsupported)"
        id: reject-filter
        continue-on-error: true
        uses: ./
        with:
          file: ${{ env.file }}
          path: $.project.authors[?(@.name == 'x')]
          value: bad

      - name: "Validate Reject Filter"
        if: ${{ steps.reject-filter.outcome != 'failure' }}
        run: |
          echo "Expected reject-filter to fail but it did not" && exit 1

      - name: "Test Reject Recursive Descent (unsupported)"
        id: reject-recursive
        continue-on-error: true
        uses: ./
        with:
          file: ${{ env.file }}
          path: $..nonexistent
          value: bad

      - name: "Validate Reject Recursive Descent"
        if: ${{ steps.reject-recursive.outcome != 'failure' }}
        run: |
          echo "Expected reject-recursive to fail but it did not" && exit 1

      - name: "Test Reject Wildcard Create (unsupported)"
        id: reject-wildcard
        continue-on-error: true
        uses: ./
        with:
          file: ${{ env.file }}
          path: $.missing[*].name
          value: bad

      - name: "Validate Reject Wildcard Create"
        if: ${{ steps.reject-wildcard.outcome != 'failure' }}
        run: |
          echo "Expected reject-wildcard to fail but it did not" && exit 1

      - name: "Test Reject Invalid Character (unsupported)"
        id: reject-char
        continue-on-error: true
        uses: ./
        with:
          file: ${{ env.file }}
          path: $.foo(bar)
          value: bad

      - name: "Validate Reject Invalid Character"
        if: ${{ steps.reject-char.outcome != 'failure' }}
        run: |
          echo "Expected reject-char to fail but it did not" && exit 1

      - name: "Schedule Failure Notification"
        if: ${{ failure() && github.event_name == 'schedule' }}
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          description: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
